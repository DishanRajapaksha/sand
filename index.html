<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="format-detection" content="telephone=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sand">
<meta name="description" content="Real sand on your screen. Tilt, shake and draw.">
<title>Sand</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #111; overscroll-behavior: none; touch-action: none; }
  body { position: fixed; inset: 0; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; font: 15px/1.35 -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, sans-serif; color: #fff; }
  button { -webkit-tap-highlight-color: transparent; touch-action: manipulation; cursor: pointer; }
  canvas { position: fixed; left: 0; top: 0; display: block; touch-action: none; transform-origin: 50% 50%; }
  #intro { position: fixed; inset: 0; display: grid; place-items: center; z-index: 5; cursor: pointer; transition: opacity .6s ease, visibility 0s linear 0s; --ink: #24211e; --sub: rgba(36,33,30,.58); --btn: #24211e; --btnInk: #f6f2ea; }
  .darkscreen #intro { --ink: #f4f1ec; --sub: rgba(244,241,236,.6); --btn: #f4f1ec; --btnInk: #1c1a18; }
  #intro.hide { opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .6s ease, visibility 0s linear .6s; }
  .card { text-align: center; color: var(--ink); padding: 32px; max-width: 300px; animation: rise .9s cubic-bezier(.2,.8,.2,1) both; }
  .card h1 { margin: 0; font-weight: 300; font-size: 44px; letter-spacing: .32em; text-indent: .32em; text-transform: uppercase; }
  .card p { margin: 14px 0 30px; color: var(--sub); font-size: 15px; letter-spacing: .01em; }
  .cta { display: inline-flex; align-items: center; justify-content: center; min-width: 132px; padding: 14px 30px; border-radius: 999px; background: var(--btn); color: var(--btnInk); font-weight: 600; font-size: 15px; letter-spacing: .04em; box-shadow: 0 10px 30px rgba(20,18,16,.18); transition: transform .15s ease; }
  #intro:active .cta { transform: scale(.97); }
  .hint { margin-top: 26px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--sub); }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
  #menuBtn { position: fixed; right: max(6px, env(safe-area-inset-right)); top: max(6px, env(safe-area-inset-top)); width: 44px; height: 44px; border: 0; background: none; z-index: 4; display: grid; place-items: center; padding: 0; opacity: 0; pointer-events: none; transition: opacity .5s ease; }
  #menuBtn i { width: 28px; height: 28px; border-radius: 50%; background: rgba(24,22,20,.28); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); display: grid; place-items: center; }
  #menuBtn svg { width: 16px; height: 16px; }
  .started #menuBtn { opacity: .75; pointer-events: auto; }
  .started.playing #menuBtn { opacity: .22; }
  #menu { position: fixed; right: max(10px, env(safe-area-inset-right)); top: calc(max(6px, env(safe-area-inset-top)) + 48px); width: min(340px, calc(100vw - 20px)); box-sizing: border-box; padding: 16px 16px 14px; border-radius: 22px; background: rgba(26,24,22,.74); -webkit-backdrop-filter: blur(24px) saturate(1.4); backdrop-filter: blur(24px) saturate(1.4); box-shadow: 0 20px 60px rgba(0,0,0,.35), inset 0 0 0 .5px rgba(255,255,255,.08); z-index: 6; transform-origin: 100% 0; transform: translateY(-6px) scale(.96); opacity: 0; pointer-events: none; transition: transform .22s cubic-bezier(.2,.8,.2,1), opacity .18s ease; }
  #menu.open { transform: none; opacity: 1; pointer-events: auto; }
  #menu h2 { font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,.5); margin: 2px 4px 10px; font-weight: 600; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .row:last-of-type { margin-bottom: 4px; }
  .swatch { flex: 1; min-width: 50px; border: 0; background: none; color: #fff; display: flex; flex-direction: column; align-items: center; gap: 7px; font: inherit; font-size: 11.5px; padding: 0; opacity: .7; transition: opacity .2s ease; }
  .swatch i { width: 36px; height: 36px; border-radius: 50%; background: var(--c); box-shadow: inset 0 -6px 10px rgba(0,0,0,.25), inset 0 3px 6px rgba(255,255,255,.15); outline: 1.5px solid transparent; outline-offset: 3px; transition: outline-color .2s ease; }
  .swatch.on { opacity: 1; }
  .swatch.on i { outline-color: rgba(255,255,255,.85); }
  .chip, .btn { border: 0; border-radius: 999px; padding: 9px 14px; font: inherit; font-size: 13.5px; color: #fff; background: rgba(255,255,255,.09); transition: background .2s ease, color .2s ease; }
  .chip.on, .btn.on { background: rgba(255,255,255,.88); color: #1c1a18; }
  .btn.primary { background: #f4efe7; color: #1c1a18; font-weight: 600; flex: 1 1 100%; padding: 12px 14px; }
  #toast { position: fixed; left: 50%; top: calc(16px + env(safe-area-inset-top)); transform: translate(-50%, -12px); opacity: 0; transition: opacity .3s ease, transform .3s ease; background: rgba(26,24,22,.78); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); padding: 10px 16px; border-radius: 14px; font-size: 13px; z-index: 7; width: max-content; max-width: min(320px, 80vw); text-align: center; pointer-events: none; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #empty { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 3; opacity: 0; visibility: hidden; transition: opacity .6s ease, visibility 0s linear .6s; }
  #empty.show { opacity: 1; visibility: visible; transition: opacity .6s ease; }
  #empty .btn { background: rgba(26,24,22,.72); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); padding: 14px 26px; font-size: 15px; letter-spacing: .02em; box-shadow: 0 10px 30px rgba(0,0,0,.18); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="intro"><div class="card"><h1>Sand</h1><p>Real sand, right on your screen.</p><span class="cta">Pour</span><div class="hint">Tilt · Shake · Draw</div></div></div>
<div id="empty"><button class="btn" id="emptyPour">Pour more sand</button></div>
<button id="menuBtn" aria-label="Menu"><i><svg viewBox="0 0 24 24" fill="#fff"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></i></button>
<div id="menu">
  <h2>Sand</h2>
  <div class="row" id="sands"></div>
  <h2>Under the sand</h2>
  <div class="row" id="screens"></div>
  <div class="row"><button class="btn primary" id="pour">Pour fresh sand</button><button class="btn" id="sound">Sound on</button><button class="btn" id="haptics">Haptics on</button></div>
</div>
<div id="toast"></div>
<script type="module" src="src/main.js"></script>
<script>
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
