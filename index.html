<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sand">
<meta name="description" content="Real sand on your screen. Tilt, shake and draw.">
<title>Sand</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #111; overscroll-behavior: none; }
  body { position: fixed; inset: 0; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; font: 15px/1.35 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; color: #fff; }
  canvas { position: fixed; left: 0; top: 0; display: block; touch-action: none; }
  #intro { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(120% 80% at 50% 40%, rgba(255,255,255,0) 0%, rgba(0,0,0,0.06) 100%); transition: opacity .5s ease; z-index: 5; cursor: pointer; }
  #intro.hide { opacity: 0; pointer-events: none; }
  .card { text-align: center; color: #2b2723; padding: 28px 30px; max-width: 320px; }
  .card h1 { margin: 0 0 6px; font-weight: 600; font-size: 34px; letter-spacing: -0.02em; }
  .card p { margin: 0 0 22px; color: #6f675e; }
  .cta { display: inline-flex; align-items: center; gap: 10px; padding: 14px 26px; border-radius: 999px; background: #2b2723; color: #f4efe7; font-weight: 600; font-size: 16px; box-shadow: 0 8px 30px rgba(43,39,35,.25); }
  .hint { margin-top: 18px; font-size: 12.5px; color: #8d857b; }
  #menuBtn { position: fixed; right: calc(14px + env(safe-area-inset-right)); bottom: calc(18px + env(safe-area-inset-bottom)); width: 40px; height: 40px; border-radius: 50%; border: 0; background: rgba(30,28,26,.28); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); z-index: 4; display: grid; place-items: center; padding: 0; opacity: .7; }
  #menuBtn svg { width: 20px; height: 20px; }
  #menu { position: fixed; left: 12px; right: 12px; bottom: calc(68px + env(safe-area-inset-bottom)); margin: 0 auto; max-width: 420px; padding: 16px; border-radius: 22px; background: rgba(28,26,24,.72); -webkit-backdrop-filter: blur(22px) saturate(1.4); backdrop-filter: blur(22px) saturate(1.4); box-shadow: 0 20px 60px rgba(0,0,0,.35); z-index: 6; transform: translateY(16px) scale(.98); opacity: 0; pointer-events: none; transition: all .22s cubic-bezier(.2,.8,.2,1); }
  #menu.open { transform: none; opacity: 1; pointer-events: auto; }
  #menu h2 { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: rgba(255,255,255,.55); margin: 4px 4px 10px; font-weight: 600; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .swatch { flex: 1; min-width: 56px; border: 0; background: none; color: #fff; display: flex; flex-direction: column; align-items: center; gap: 6px; font: inherit; font-size: 12px; padding: 0; opacity: .75; }
  .swatch i { width: 40px; height: 40px; border-radius: 50%; background: var(--c); box-shadow: inset 0 -6px 10px rgba(0,0,0,.25), inset 0 3px 6px rgba(255,255,255,.15); outline: 2px solid transparent; outline-offset: 3px; }
  .swatch.on { opacity: 1; }
  .swatch.on i { outline-color: rgba(255,255,255,.85); }
  .chip, .btn { border: 0; border-radius: 999px; padding: 10px 14px; font: inherit; font-size: 14px; color: #fff; background: rgba(255,255,255,.1); }
  .chip.on, .btn.on { background: rgba(255,255,255,.88); color: #1c1a18; }
  .btn.primary { background: #f4efe7; color: #1c1a18; font-weight: 600; flex: 1; }
  .tips { font-size: 12.5px; color: rgba(255,255,255,.6); margin: 2px 4px 0; }
  #toast { position: fixed; left: 50%; top: calc(16px + env(safe-area-inset-top)); transform: translate(-50%, -20px); opacity: 0; transition: all .3s ease; background: rgba(28,26,24,.8); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); padding: 10px 16px; border-radius: 14px; font-size: 13.5px; z-index: 7; max-width: 86vw; text-align: center; pointer-events: none; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #empty { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 3; opacity: 0; pointer-events: none; transition: opacity .6s ease; }
  #empty.show { opacity: 1; pointer-events: auto; }
  #empty .btn { background: rgba(28,26,24,.75); padding: 14px 24px; font-size: 15px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="intro"><div class="card"><h1>Sand</h1><p>A handful of real sand, right on your screen.</p><span class="cta">Pour it</span><div class="hint">Tilt · shake · drag your finger · flip it to empty</div></div></div>
<div id="empty"><button class="btn" id="emptyPour">Pour more sand</button></div>
<button id="menuBtn" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.9)" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="1.2" fill="#fff"/><circle cx="12" cy="12" r="1.2" fill="#fff"/><circle cx="19" cy="12" r="1.2" fill="#fff"/></svg></button>
<div id="menu">
  <h2>Sand</h2>
  <div class="row" id="sands"></div>
  <h2>Under the sand</h2>
  <div class="row" id="screens"></div>
  <div class="row"><button class="btn primary" id="pour">Pour fresh sand</button><button class="btn" id="sound">Sound on</button></div>
  <div class="tips">Tilt to let it slide, jerk the phone to throw it, flip face-down to empty it.</div>
</div>
<div id="toast"></div>
<script type="module" src="src/main.js"></script>
<script>
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
